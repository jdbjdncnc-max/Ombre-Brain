<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Companion 1.0</title>
  <link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <section class="phone-shell" aria-label="Companion app">
      <header class="top-bar">
        <span id="clock" class="clock">09:41</span>
        <span id="serverStatus" class="server-status">连接中</span>
      </header>

      <main class="screen">
        <section id="chatView" class="view view-active" aria-label="对话">
          <div class="chat-header">
            <div>
              <p class="eyebrow">Companion</p>
              <h1>对话</h1>
            </div>
          </div>

          <div id="messageList" class="message-list" aria-live="polite"></div>

          <form id="composer" class="composer">
            <textarea id="messageInput" rows="1" placeholder="说点什么" autocomplete="off"></textarea>
            <button id="sendButton" class="send-button" type="submit" title="发送" aria-label="发送">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h13M13 6l6 6-6 6"/>
              </svg>
            </button>
          </form>
        </section>

        <section id="homeView" class="view" aria-label="主页"></section>

        <section id="memoryView" class="view" aria-label="记忆">
          <div class="memory-header">
            <div>
              <p class="eyebrow">Companion</p>
              <h1>记忆</h1>
            </div>
            <button id="refreshMemoryButton" class="icon-button" type="button" title="刷新" aria-label="刷新">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
                <path d="M20 4v6h-6"/>
              </svg>
            </button>
          </div>

          <div class="segment-control" role="tablist" aria-label="记忆类型">
            <button class="segment-button segment-active" type="button" data-memory-panel="memories">记忆</button>
            <button class="segment-button" type="button" data-memory-panel="diary">日记</button>
            <button class="segment-button" type="button" data-memory-panel="profile">画像</button>
          </div>

          <div class="memory-panels">
            <section id="memoriesPanel" class="memory-panel panel-active" aria-label="记忆条目">
              <form id="memorySearchForm" class="memory-search">
                <input id="memorySearchInput" type="search" placeholder="搜索记忆">
                <button class="small-icon-button" type="submit" title="搜索" aria-label="搜索">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M16.5 16.5 21 21"/>
                  </svg>
                </button>
              </form>
              <div id="memorySummary" class="panel-summary">载入中</div>
              <div id="memoryList" class="item-list"></div>
            </section>

            <section id="diaryPanel" class="memory-panel" aria-label="日记">
              <div id="diaryStats" class="metric-grid">
                <div class="metric"><span>公开</span><strong>0</strong></div>
                <div class="metric"><span>私密</span><strong>0</strong></div>
                <div class="metric"><span>总计</span><strong>0</strong></div>
              </div>
              <div id="publicDiaryList" class="item-list"></div>
            </section>

            <section id="profilePanel" class="memory-panel" aria-label="画像">
              <label class="profile-block">
                <span>用户画像</span>
                <textarea id="userProfileText" rows="7" spellcheck="false"></textarea>
              </label>
              <label class="profile-block">
                <span>AI 画像</span>
                <textarea id="aiProfileText" rows="7" spellcheck="false"></textarea>
              </label>
              <div class="button-row profile-actions">
                <button id="saveProfileButton" class="primary-button" type="button">保存画像</button>
                <span id="profileStatus" class="inline-status"></span>
              </div>
            </section>
          </div>
        </section>

        <section id="scheduleView" class="view" aria-label="日程">
          <div class="schedule-header">
            <div>
              <p class="eyebrow">Companion</p>
              <h1>日程</h1>
            </div>
            <button id="scheduleNotifyButton" class="icon-button" type="button" title="提醒" aria-label="提醒">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
            </button>
          </div>

          <div class="schedule-dashboard">
            <div class="schedule-next">
              <span id="scheduleTodayCount">今日 0 项</span>
              <strong id="scheduleNextTitle">今天清爽</strong>
              <small id="scheduleNextMeta">没有临近日程</small>
            </div>
            <div id="scheduleSyncStatus" class="schedule-status">本地日程</div>
          </div>

          <section class="schedule-section">
            <div class="section-title-row">
              <strong>今日待办</strong>
              <span id="todoCaptureStatus" class="inline-status"></span>
            </div>
            <form id="todoForm" class="schedule-form">
              <label class="compact-field">
                <span>日期</span>
                <input id="todoDate" type="date">
              </label>
              <label class="compact-field">
                <span>时间</span>
                <input id="todoTime" type="time">
              </label>
              <label class="compact-field task-field">
                <span>任务</span>
                <input id="todoTitle" type="text" placeholder="写完实验报告">
              </label>
              <button class="small-icon-button" type="submit" title="加入" aria-label="加入">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
              </button>
            </form>
          </section>

          <section class="schedule-section">
            <div class="section-title-row">
              <strong>课表</strong>
              <span id="courseImportStatus" class="inline-status"></span>
            </div>
            <form id="termForm" class="term-form">
              <label class="compact-field">
                <span>开学周一</span>
                <input id="termStartDate" type="date">
              </label>
              <label class="compact-field">
                <span>总周数</span>
                <input id="termWeekCount" type="number" min="1" max="30" step="1">
              </label>
              <button id="saveTermButton" class="secondary-button" type="submit">保存</button>
            </form>
            <textarea id="courseImportText" class="course-import" rows="5" placeholder="周一 3-4 细胞生物学 @八410 第1-16周&#10;周三 1-8 分子生物学实验 @生地楼312 第2-17周&#10;周五 5-8 遗传学实验 @生地楼508 单周"></textarea>
            <div class="button-row">
              <button id="importCoursesButton" class="primary-button" type="button">导入课表</button>
              <button id="clearCourseImportButton" class="secondary-button" type="button">清空</button>
            </div>
          </section>

          <section class="schedule-section week-section">
            <div class="week-toolbar">
              <button id="previousWeekButton" class="small-icon-button" type="button" title="上一周" aria-label="上一周">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M15 18l-6-6 6-6"/>
                </svg>
              </button>
              <div class="week-heading">
                <strong id="weekTitle">本周</strong>
                <span id="weekRange">--</span>
              </div>
              <button id="nextWeekButton" class="small-icon-button" type="button" title="下一周" aria-label="下一周">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 18l6-6-6-6"/>
                </svg>
              </button>
              <button id="currentWeekButton" class="text-button" type="button">本周</button>
            </div>
            <div id="weekGrid" class="week-grid" aria-label="周课表"></div>
          </section>

          <section class="schedule-section timeline-section">
            <div class="section-title-row">
              <strong>今天</strong>
              <button id="clearDoneButton" class="text-button" type="button">清除已完成</button>
            </div>
            <div id="scheduleTimeline" class="item-list"></div>
          </section>

          <section class="schedule-section timeline-section">
            <div class="section-title-row">
              <strong>接下来</strong>
              <span id="upcomingSummary" class="inline-status"></span>
            </div>
            <div id="upcomingScheduleList" class="item-list"></div>
          </section>
        </section>

        <section id="settingsView" class="view" aria-label="设置">
          <div class="settings-header">
            <p class="eyebrow">Companion</p>
            <h1>设置</h1>
          </div>

          <div class="settings-list">
            <label class="field">
              <span>后端地址</span>
              <input id="backendUrl" type="url" inputmode="url">
            </label>

            <label class="field">
              <span>网关令牌</span>
              <input id="gatewayToken" type="password" autocomplete="current-password" placeholder="OMBRE_GATEWAY_TOKEN">
            </label>

            <label class="field">
              <span>模型</span>
              <input id="modelName" type="text" spellcheck="false">
            </label>

            <label class="field">
              <span>温度</span>
              <div class="range-row">
                <input id="temperature" type="range" min="0" max="2" step="0.1">
                <output id="temperatureValue">0.7</output>
              </div>
            </label>

            <label class="field">
              <span>系统提示词</span>
              <textarea id="systemPrompt" rows="5" spellcheck="false"></textarea>
            </label>

            <label class="field">
              <span>背景图片</span>
              <input id="backgroundUrl" type="url" inputmode="url" placeholder="https://...">
            </label>

            <div class="button-row">
              <button id="chooseBackgroundButton" class="secondary-button" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 6h16v12H4z"/>
                  <path d="M7 15l3-3 2 2 3-4 2 5"/>
                  <path d="M8 9h.01"/>
                </svg>
                <span>选择图片</span>
              </button>
              <button id="resetBackgroundButton" class="secondary-button" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h16"/>
                  <path d="M10 11v6M14 11v6"/>
                  <path d="M6 7l1 14h10l1-14"/>
                  <path d="M9 7V4h6v3"/>
                </svg>
                <span>重置</span>
              </button>
              <input id="backgroundFile" type="file" accept="image/*" hidden>
            </div>

            <label class="field">
              <span>背景透明度</span>
              <div class="range-row">
                <input id="backgroundTransparency" type="range" min="0" max="1" step="0.05">
                <output id="backgroundTransparencyValue">35%</output>
              </div>
            </label>

            <label class="field">
              <span>背景图显示</span>
              <select id="backgroundFit">
                <option value="cover">自动剪裁</option>
                <option value="contain">完整显示</option>
              </select>
            </label>

            <label class="field">
              <span>主题色</span>
              <input id="accentColor" type="color">
            </label>

            <div class="button-row">
              <button id="saveSettingsButton" class="primary-button" type="button">保存</button>
              <button id="clearChatButton" class="secondary-button" type="button">清空对话</button>
            </div>
          </div>
        </section>
      </main>

      <nav class="bottom-tabs" aria-label="底部导航">
        <button class="tab-button tab-active" type="button" data-tab="chat">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5h16v11H8l-4 4z"/>
          </svg>
          <span>对话</span>
        </button>
        <button class="tab-button" type="button" data-tab="memory">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V5a1 1 0 0 1 1-1z"/>
            <path d="M9 8h5M9 12h6M9 16h4"/>
          </svg>
          <span>记忆</span>
        </button>
        <button class="tab-button home-tab-button" type="button" data-tab="home" title="主页" aria-label="主页">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
            <path d="M16 8 2 22"/>
            <path d="M17.5 15H9"/>
          </svg>
        </button>
        <button class="tab-button" type="button" data-tab="schedule">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 2v4M16 2v4"/>
            <path d="M3 10h18"/>
            <path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2z"/>
            <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
          </svg>
          <span>日程</span>
        </button>
        <button class="tab-button" type="button" data-tab="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.04.04-2 3.46-.05-.02a1.7 1.7 0 0 0-1.9.32 1.7 1.7 0 0 0-.48 1.32H8.65a1.7 1.7 0 0 0-.48-1.32 1.7 1.7 0 0 0-1.9-.32l-.05.02-2-3.46.04-.04A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.16-1.56H3.4V10.56h.04A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.04-.04 2-3.46.05.02a1.7 1.7 0 0 0 1.9-.32A1.7 1.7 0 0 0 8.65 2h6.7a1.7 1.7 0 0 0 .48 1.32 1.7 1.7 0 0 0 1.9.32l.05-.02 2 3.46-.04.04A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.16 1.56h.04v2.88h-.04A1.7 1.7 0 0 0 19.4 15z"/>
          </svg>
          <span>设置</span>
        </button>
      </nav>
    </section>
  </div>

  <script src="/frontend/app.js" type="module"></script>
</body>
</html>
